  </g>
  <g fill="#dfe9f5" font-family="'VT323', 'Courier New', monospace" text-anchor="middle">
    <text x="450" y="128" font-size="104" letter-spacing="4">TRIBUNA CENTRAL</text>
    <text x="450" y="206" font-size="58" letter-spacing="12">2.0 OFFICES</text>
    <text x="450" y="250" font-size="26" letter-spacing="8" fill-opacity="0.7">REDACCIÓN DIGITAL</text>
  </g>
